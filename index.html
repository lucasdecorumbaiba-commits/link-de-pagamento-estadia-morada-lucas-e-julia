<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout - Hospedagem VIP</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; }
    .card { background: #fff; width: 100%; max-width: 400px; border-radius: 12px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
    h2 { margin-top: 0; margin-bottom: 6px; font-size: 20px; color: #111827; }
    .subtitulo { font-size: 13px; color: #6b7280; margin-bottom: 18px; }
    .resumo { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 14px; margin-bottom: 18px; font-size: 14px; color: #374151; }
    .linha { display: flex; justify-content: space-between; margin-bottom: 8px; gap: 12px; }
    .total { display: flex; justify-content: space-between; font-weight: bold; font-size: 16px; border-top: 1px solid #e5e7eb; padding-top: 10px; color: #111827; }
    label { display: block; font-size: 13px; color: #4b5563; margin-bottom: 6px; }
    input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; margin-bottom: 14px; font-size: 14px; background: #f9fafb; }
    input:focus { background: #fff; outline: 2px solid #16a34a; border-color: transparent; }
    button { width: 100%; padding: 12px; background: #16a34a; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
    button:hover { background: #15803d; }
    #surpresa { display: none; text-align: center; margin-top: 10px; }
    #surpresa h3 { color: #16a34a; margin-bottom: 8px; }
    #surpresa p { color: #374151; font-size: 15px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="card">
    <div id="tela-pagamento">
      <h2>Finalizar hospedagem</h2>
      <div class="subtitulo">Reserva exclusiva para <strong>Ana Beatriz dos Santos Walter</strong></div>
      <div class="resumo">
        <div class="linha"><span>Pacote VIP de 15 diárias</span><span>Incluso</span></div>
        <div class="linha"><span>Café da manhã, almoço e Wi-Fi</span><span>Incluso</span></div>
        <div class="linha"><span>Taxa de bagunça</span><span>R$ 0,00</span></div>
        <div class="total"><span>Total a pagar</span><span>R$ 0,00</span></div>
      </div>
      <form id="fake-form">
        <label for="nome">Hóspede titular</label>
        <input type="text" id="nome" value="Ana Beatriz dos Santos Walter" required />
        <label for="obs">Algum pedido especial para os 15 dias?</label>
        <input type="text" id="obs" placeholder="Ex.: ar-condicionado no 18°C" />
        <button type="submit">Confirmar e pagar agora</button>
      </form>
    </div>
    <div id="surpresa">
      <h3>Pagamento aprovado!</h3>
      <p id="mensagem-final"></p>
      https://i.pinimg.com/236x/57/fe/18/57fe18529703399df7926d81eed67ff6.jpg
    </div>
  </div>
  <script>
    document.getElementById('fake-form').addEventListener('submit', function (event) {
      event.preventDefault();
      document.getElementById('tela-pagamento').style.display = 'none';
      document.getElementById('mensagem-final').textContent = 'Ana Beatriz, você não vai pagar nada não! Só aproveita os seus 15 dias aqui.';
      document.getElementById('surpresa').style.display = 'block';
    });
  </script>
</body>
</html>
